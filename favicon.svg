<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0a12"/>
  
  <!-- Outer neon border (cyan) -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.9"/>
  
  <!-- Soft glow ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00f5ff" stroke-width="6" opacity="0.25"/>
  
  <!-- Main orb -->
  <circle cx="32" cy="32" r="16" fill="url(#orbGradient)"/>
  
  <!-- Shine highlight -->
  <circle cx="26" cy="26" r="5" fill="white" opacity="0.45"/>
  
  <!-- Gradient definition -->
  <defs>
    <radialGradient id="orbGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#80ffff"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0088aa"/>
    </radialGradient>
  </defs>
</svg>
